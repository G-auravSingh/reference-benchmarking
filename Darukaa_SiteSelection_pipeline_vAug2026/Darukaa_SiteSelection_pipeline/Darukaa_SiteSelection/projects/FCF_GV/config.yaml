# FCF GV — agroforestry, scattered across 4 districts (Ganjam, Gajapati,
# Kandhmal, Kalahandi), 1,893 farm parcels, ~200km x 157km bounding box.

client_name: FCF
project_name: FCF_GV
archetype: agroforestry
realm: terrestrial

# GV's KML uses standard KML ExtendedData/SchemaData, but with DIFFERENT
# field names than Soova for the same underlying attributes — confirmed by
# direct inspection: Farmer_s_n, District, Grampancha, Village, Year_of_pl,
# Submission, area_ha. NOTE: there is no `block`/`Block_Name` field in this
# KML at all (confirmed absent) — this was flagged in an earlier session as
# a generalization gap (pipeline only looked for Block/Block_Name and
# silently missed Grampancha/District); the crosswalk here is the actual
# fix — admin_grampanchayat and admin_district are matched from their real
# field names via the shared default crosswalk, no code change needed.
attribute_crosswalk:
  plantation_year: [Year_of_pl]

# Only plantation_year is usable here — GV has no block-equivalent field at
# all, so admin_block will show 0% coverage in the ingestion report (this is
# expected and reported, not an error). Grampanchayat/district ARE present
# via the default crosswalk and can still inform the geography-aware
# clustering constraint in 03 (barrier/administrative discontinuity), even
# though they're not used as stratification_attributes here.
stratification_attributes:
  - plantation_year

n_devices: 4
project_duration_weeks: 5
project_start_date: "2026-10-19"  # tentative
cycle_length_days: 7
# CORRECTED (Aug 2026, exact schedule given directly): was 3, a stale
# explicit override predating the fix to the shared default (day 1 deploy,
# days 2-6 recording, day 7 retrieval, day 8 buffer, day 9 next deploy —
# 1 buffer day, not 3). This project-level override was silently
# shadowing the corrected default until caught by checking actual
# scheduled cycle day-offsets against the stated schedule, not just
# trusting the default change alone.
logistics_buffer_days: 1

deployment_regime: sequential_cluster
streams_active: [audiomoth]

