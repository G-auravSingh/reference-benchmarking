# Darukaa fixed concern convention — no metric-specific raw thresholds are required.
#
# Every scoreable indicator follows:
#   raw value → approved comparable reference → metric-specific intactness transform
#   → 0–100 intactness → fixed concern band
#
# Fixed product bands:
#   80–100%  Very Low concern
#   60–<80%  Low concern
#   40–<60%  Moderate concern
#   20–<40%  High concern
#   0–<20%   Very High concern
#
# These bands are a declared Darukaa product convention, not universal ecological thresholds.
#
# References are still metric-specific. For a score to be eligible, the selected reference
# must be explicitly approved in the profile:
#
# reference:
#   tier1_approved_for_scoring: true
#   # OR
#   tier2_approved_for_scoring: true
#
# No metric-specific threshold table is necessary for the fixed-band scoring model.
# Use scoring.reference_ratio_thresholds_by_metric only for legacy migration, not new work.
